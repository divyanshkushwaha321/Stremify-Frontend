<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Background Dark Gradient -->
    <linearGradient id="streamBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24252c" />
      <stop offset="100%" stop-color="#0f1015" />
    </linearGradient>

    <!-- Crimson Primary Glow Gradient -->
    <linearGradient id="streamPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4d" />
      <stop offset="50%" stop-color="#e50914" />
      <stop offset="100%" stop-color="#99000a" />
    </linearGradient>

    <!-- Electric Cyan/Blue Accent Gradient -->
    <linearGradient id="streamCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0062c4" />
      <stop offset="100%" stop-color="#70b4ff" />
    </linearGradient>

    <!-- Border Rim Gradient -->
    <linearGradient id="streamRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b6b" stop-opacity="0.6" />
      <stop offset="40%" stop-color="#e50914" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0072d7" stop-opacity="0.4" />
    </linearGradient>

    <!-- Soft Ambient Glow Filter -->
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle Container -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#streamBg)" stroke="url(#streamRim)" stroke-width="2.5" />

  <!-- Ambient Neon Red Core Glow -->
  <circle cx="58" cy="60" r="28" fill="#e50914" opacity="0.16" filter="url(#glowEffect)" />

  <!-- Dynamic S-Wave Stream Ribbon (Upper Loop) -->
  <path d="M 34 38 C 34 30, 42 24, 58 24 C 74 24, 86 31, 86 42 C 86 52, 76 56, 62 60 L 48 64 C 36 67, 30 73, 30 82 C 30 92, 42 98, 58 98 C 76 98, 86 91, 88 83" 
        stroke="url(#streamPrimary)" 
        stroke-width="11" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Forward-Firing Precision Play Icon (Cyan Neon Core) -->
  <path d="M 50 44 L 76 60 L 50 76 Z" 
        fill="url(#streamCyan)" 
        filter="url(#glowEffect)" />

  <!-- Inner Play Spark Highlight -->
  <polygon points="53,49 71,60 53,71" fill="#ffffff" opacity="0.4" />

  <!-- Live Broadcast Transmission Indicator Pulse -->
  <circle cx="88" cy="28" r="4.5" fill="#e50914" filter="url(#glowEffect)" />
  <circle cx="88" cy="28" r="2.5" fill="#ffffff" />
</svg>
